version: '3.8'

services:
  web:
    build: .
    ports:
      - "5050:5050"
    volumes:
      - ./compromis.db:/app/compromis.db
      - ./uploads:/app/uploads
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - API_VILLE_URL=${API_VILLE_URL:-}
      - API_VILLE_TOKEN=${API_VILLE_TOKEN:-}
    restart: unless-stopped