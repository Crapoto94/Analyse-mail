{% extends "base.html" %}
{% block title %}Documentation API{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1><i class="bi bi-file-earmark-code"></i> Documentation de l'API externe</h1>
    <div>
        <a href="{{ url_for('list_api_keys') }}" class="btn btn-outline-secondary">
            <i class="bi bi-key"></i> Clés d'API
        </a>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Accueil
        </a>
    </div>
</div>
<p class="text-muted">
    Authentification par en-tête <code>X-API-Key</code> — générez une clé depuis
    <a href="{{ url_for('list_api_keys') }}">Clés d'API</a>. Spécification brute :
    <a href="{{ url_for('api_v1_openapi') }}" target="_blank">/api/v1/openapi.json</a>.
</p>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
<div id="swagger-ui"></div>
<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
window.addEventListener('load', function() {
    window.ui = SwaggerUIBundle({
        url: '{{ url_for("api_v1_openapi") }}',
        dom_id: '#swagger-ui',
        presets: [SwaggerUIBundle.presets.apis],
        layout: 'BaseLayout',
    });
});
</script>
{% endblock %}
